name: github pages

on:
  push:
    branches:
      - docs

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Checkout repository
        uses: actions/checkout@v1
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # caching pip dependencies

      - name: Install Pip Requirements 🐷
        run: pip install -r requirements.txt

      - name: Install doxygen 🧪
        uses: ssciwr/doxygen-install@v1

      - name: Clone libigl & run doxygen 🤖
        run: |
          git clone https://github.com/libigl/libigl/
          cd libigl/
          (cat docs/doxygen.conf ; echo "OUTPUT_DIRECTORY=../docs/") | doxygen -

      - name: Generate the Python API reference 🐍
        shell: bash
        run: |
          python -m pip install libigl
          python generate_python_api.py \
            --package "$(python -c 'import igl, os; print(os.path.dirname(igl.__file__))')" \
            --igl-include libigl/include \
            --dox-index docs/dox/files.html \
            --out docs/python/api

      - name: Build website 🛠
        shell: bash
        run: mkdocs build

      - name: Deploy to GH Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
